# Champion config — aggressive single-head Top-2 (2026-08-01, B-round)
# User directive: pursue excess return, no ensemble dilution.
# Best single learned ranking head (seed2024, corrected shared features,
# NDCG Context Transformer, 7 features) -> Top-2 equal weight (50/50).
# 10-week OOS: weekly excess +5.26%, cum +81.7%, worst week -5.3%
# (top2_equal variant; see docs/aggressive_variants_20260801.md).
# ML-driven selection; only risk screens (ScreenProcessor) as constraints.

qlib_init:
  provider_uri: "./temp/qlib_data"
  region: cn

task:
  model:
    class: KronosContextHeadModel
    module_path: "code.models.KronosContextHead.KronosContextHead"
    kwargs:
      model_name: "small"
      pretrained_dir: "./model/kronos_pretrained"
      finetuned_dir: "./model/kronos_finetuned/Kronos-small-lb60"
      max_context: 512
      pred_len: 5
      T: 1.0
      top_p: 0.9
      sample_count: 1
      seed: 42
      d_model: 32
      nhead: 4
      num_layers: 2
      dim_feedforward: 64
      dropout: 0.1
      head_weights:
        - "./model/context_head/head_s2024.pt"

  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: StockDataHandler
        module_path: "code.handlers.stock_handler"
        kwargs:
          instruments: "all"
          start_time: "2022-01-01"
          end_time: "2026-07-31"
          fit_start_time: "2022-01-01"
          fit_end_time: "2025-12-31"
          infer_processors:
            - class: FridayFilterProcessor
              module_path: "code.processors.custom_processor"
            - class: Fillna
              module_path: "qlib.data.dataset.processor"
              kwargs:
                fields_group: "feature"
            - class: ScreenProcessor
              module_path: "code.processors.custom_processor"
              kwargs:
                min_amount_rank: 0.3
                trend_ma: 60
                max_drawdown: 0.15
          learn_processors:
            - class: DropnaLabel
              module_path: "qlib.data.dataset.processor"
      segments:
        train: ["2024-01-01", "2026-04-17"]
        valid: ["2026-04-24", "2026-05-08"]
        test:  ["2026-05-15", "2026-07-31"]

  evaluation:
    universe: "all"
    data_end: "2026-07-31"
    exposure_mode: "rank_weighted"
    rank_weights: [0.5, 0.5]
