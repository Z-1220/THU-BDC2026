[project]
name = "baseline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "einops>=0.8.1",
    "huggingface_hub>=0.33.1",
    "numpy>=2.2.6",
    "pandas>=2.3.2",
    "pyqlib>=0.9.7",
    "pyyaml>=6.0",
    "safetensors>=0.6.2",
    "scipy>=1.15.3",
    "torch>=2.6.0",
    "tqdm>=4.67.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
