# ============================================================
# 统一配置文件：Qlib 初始化 + 数据 + 特征 + 模型 + 训练 + 回测
# 替代旧的 code/src/config.py
# ============================================================

# --- Qlib 初始化 ---
qlib_init:
  provider_uri: "./qlib_data/hs300_data"
  region: "cn"

# --- 数据时间段 ---
data:
  train_start: "2024-01-01"
  train_end: "2026-02-10"
  valid_start: "2026-02-11"
  valid_end: "2026-04-10"
  test_start: "2026-04-13"
  test_end: "2026-04-17"
  instruments: "all"
  raw_csv_path: "./data/stock_data.csv"
  sector_map_path: "./data/sector_map.json"
  qlib_dir: "./qlib_data/hs300_data"

# --- 特征设置 ---
features:
  enable_extra_technical: true     # MACD signal / KDJ / ATR / OBV / RSI 等 Alpha158 未覆盖的
  enable_advanced: true            # 高级个股特征（动量质量/风险度量/流动性/价格位置/波动率结构）
  enable_cross_sectional: true     # 跨截面特征（市场级 + 板块级 + 横截面排名/Z-score）
  sequence_length: 60

# --- 模型超参数 ---
model:
  class: "PointwiseStockTransformer"
  d_model: 256
  nhead: 4
  num_layers: 3
  dim_feedforward: 512
  dropout: 0.1

# --- 训练设置 ---
training:
  seed: 42
  batch_size: 256
  num_epochs: 50
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  scheduler: "cosine"
  enable_grad_clip: true
  max_grad_norm: 5.0
  loss: "mse"
  early_stop_patience: 10
  num_workers: 0

# --- 评估 ---
evaluation:
  metrics: ["IC", "ICIR", "Rank IC", "Rank ICIR"]
  top_k: 5

# --- 回测 ---
backtest:
  top_k: 5
  max_weight_sum: 1.0
  rebalance_freq: 5
  benchmark: "SH000300"

# --- 输出路径 ---
output:
  model_dir: "./model/qlib_full"
  result_path: "./output/result.csv"
