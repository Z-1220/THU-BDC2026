# ============================================================
# 比赛调参配置 — 已清除所有非必要产物
# ============================================================
qlib_init:
  provider_uri: "./temp/qlib_data"
  region: cn

task:
  model:
    class: LGBModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      loss: mse
      learning_rate: 0.05
      max_depth: 6
      num_boost_round: 500
      early_stopping_rounds: 50
      seed: 42

  strategy:
      class: PyPortfolioOptStrategy
      module_path: "code.PortfolioBuilder.portfolio_strategy"
      kwargs:
        optimizer: "risk_parity"
        top_k: 5
        risk_model: "ledoit_wolf"
        lookback: 60
        risk_free_rate: 0.02


  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: StockDataHandler
        module_path: "code.handlers.stock_handler"
        kwargs:
          instruments: "all"
          start_time: "2024-01-01"
          end_time: "2026-05-27"
          fit_start_time: "2024-01-01"
          fit_end_time: "2025-12-31"
          infer_processors:
            # ---- 自定义因子 Processor ----
            - class: MomentumProcessor
              module_path: "code.processors.custom_processor"
            - class: VolatilityProcessor
              module_path: "code.processors.custom_processor"
            - class: VolumeProcessor
              module_path: "code.processors.custom_processor"
            - class: MomentumQualityProcessor
              module_path: "code.processors.custom_processor"
            - class: TailRiskProcessor
              module_path: "code.processors.custom_processor"
            - class: DistributionProcessor
              module_path: "code.processors.custom_processor"
            - class: LiquidityProcessor
              module_path: "code.processors.custom_processor"
            - class: PricePositionProcessor
              module_path: "code.processors.custom_processor"
            - class: VolatilityStructureProcessor
              module_path: "code.processors.custom_processor"
            - class: CrossSectionalRankProcessor
              module_path: "code.processors.custom_processor"
            - class: MarketLevelProcessor
              module_path: "code.processors.custom_processor"
            - class: SectorLevelProcessor
              module_path: "code.processors.custom_processor"
            # ---- 周五过滤：对齐 Mon-Fri 完整周评测 ----
            - class: FridayFilterProcessor
              module_path: "code.processors.custom_processor"
            # ---- 标准化 + 填充 ----
            - class: RobustZScoreNorm
              module_path: "qlib.data.dataset.processor"
              kwargs:
                fields_group: "feature"
                clip_outlier: True
            - class: Fillna
              module_path: "qlib.data.dataset.processor"
              kwargs:
                fields_group: "feature"
            - class: ScreenProcessor
              module_path: "code.processors.custom_processor"
              kwargs:
                min_amount_rank: 0.3
                trend_ma: 60
                max_drawdown: 0.15
            # [已删除] FridayFilterProcessor — 未定义，且应在评测层过滤而非数据层
          learn_processors:
            # [已修复] 只保留标签处理，删除了重复的标准化
            - class: DropnaLabel
              module_path: "qlib.data.dataset.processor"
      segments:
        train: ["2024-01-01", "2025-12-31"]
        valid: ["2026-01-05", "2026-01-30"]
        test:  ["2026-02-02", "2026-05-27"]

  # ---- 比赛专属评测配置（run_all_model.py 读取，Qlib原生不识别）----
  evaluation:
    universe: "all"
    data_end: "2026-05-27"