# Plan A Experiment E4: Coarse-to-fine ranking",

qlib_init:
  provider_uri: "./temp/qlib_data"
  region: cn

task:
  model:
    class: KronosRankHeadModel
    module_path: "code.models.KronosRankHead.KronosRankHead"
    kwargs:
      model_name: "small"
      pretrained_dir: "./model/kronos_pretrained"
      max_context: 512
      pred_len: 5
      seed: 42
      cs_zscore: true
      head_hidden_dims: [64, 32]
      head_dropout: 0.1
      loss_type: "coarse_to_fine"
      loss_kwargs:
                coarse_weight: 0.3
        fine_weight: 0.7
        n_tiers: 3
        fine_margin: 0.05
      lr: 0.001
      weight_decay: 0.00001
      epochs: 100
      early_stop_patience: 15
      batch_size: 256

  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: StockDataHandler
        module_path: "code.handlers.stock_handler"
        kwargs:
          instruments: "all"
          start_time: "2022-01-01"
          end_time: "2026-06-26"
          fit_start_time: "2022-01-01"
          fit_end_time: "2025-12-31"
          infer_processors:
            - class: FridayFilterProcessor
              module_path: "code.processors.custom_processor"
            - class: Fillna
              module_path: "qlib.data.dataset.processor"
              kwargs:
                fields_group: "feature"
            - class: ScreenProcessor
              module_path: "code.processors.custom_processor"
              kwargs:
                min_amount_rank: 0.3
                trend_ma: 60
                max_drawdown: 0.15
          learn_processors:
            - class: DropnaLabel
              module_path: "qlib.data.dataset.processor"
      segments:
        train: ["2022-01-01", "2025-12-31"]
        valid: ["2026-01-05", "2026-01-30"]
        test:  ["2026-02-02", "2026-05-27"]

  evaluation:
    universe: "all"
    data_end: "2026-06-26"
    exposure_mode: "rank_weighted"
    rank_weights: [0.333, 0.333, 0.334]
