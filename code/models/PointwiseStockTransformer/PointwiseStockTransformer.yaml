qlib_init:
  provider_uri: "./temp/qlib_data"
  region: cn

task:
  model:
    class: PointwiseTransformerModel
    module_path: "code.models.PointwiseStockTransformer.PointwiseStockTransformer"
    kwargs:
      seq_len: 60
      d_model: 256
      nhead: 4
      num_layers: 3
      dim_feedforward: 512
      dropout: 0.1
      batch_size: 64
      n_epochs: 50
      lr: 1.0e-4
      weight_decay: 1.0e-5
      loss: "mse"
      seed: 42

  # ── 修复2: 补上 strategy（run_all_model.py 必读） ──
  strategy:
    class: PyPortfolioOptStrategy
    module_path: "code.PortfolioBuilder.portfolio_strategy"
    kwargs:
      optimizer: "mean_variance"
      top_k: 5
      risk_model: "ledoit_wolf"
      lookback: 60
      risk_free_rate: 0.02

  dataset:
    class: TSDatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: StockDataHandler
        module_path: "code.handlers.stock_handler"
        kwargs:
          instruments: "all"
          start_time: "2024-01-01"
          end_time: "2026-04-17"
          fit_start_time: "2024-01-01"
          fit_end_time: "2025-12-31"          # ← 修复1: 严格在 test 之前
          infer_processors:
            # ---- 自定义因子 Processor ----
            - class: MomentumProcessor
              module_path: "code.processors.custom_processor"
            - class: VolatilityProcessor
              module_path: "code.processors.custom_processor"
            - class: VolumeProcessor
              module_path: "code.processors.custom_processor"
            - class: MomentumQualityProcessor
              module_path: "code.processors.custom_processor"
            - class: TailRiskProcessor
              module_path: "code.processors.custom_processor"
            - class: DistributionProcessor
              module_path: "code.processors.custom_processor"
            - class: LiquidityProcessor
              module_path: "code.processors.custom_processor"
            - class: PricePositionProcessor
              module_path: "code.processors.custom_processor"
            - class: VolatilityStructureProcessor
              module_path: "code.processors.custom_processor"
            - class: CrossSectionalRankProcessor
              module_path: "code.processors.custom_processor"
            - class: MarketLevelProcessor
              module_path: "code.processors.custom_processor"
            - class: SectorLevelProcessor
              module_path: "code.processors.custom_processor"
            # ---- 标准化 + 填充 ----
            # ← 修复4: 补上 module_path
            - class: RobustZScoreNorm
              module_path: "qlib.data.dataset.processor"
              kwargs:
                fields_group: "feature"
                clip_outlier: True
            - class: Fillna
              module_path: "qlib.data.dataset.processor"
              kwargs:
                fields_group: "feature"
          learn_processors:
            - class: DropnaLabel
              module_path: "qlib.data.dataset.processor"

      segments:
        train: ["2024-01-01", "2025-12-31"]
        valid: ["2026-01-05", "2026-01-30"]
        test:  ["2026-02-02", "2026-04-10"]
      step_len: 60
      fillna_type: "ffill+bfill"

  # ── 修复3: 补上 evaluation（run_all_model.py 必读） ──
  evaluation:
    universe: "all"
    data_end: "2026-04-17"