qlib_init:
  provider_uri: "./temp/qlib_data"
  region: cn
  exp_manager:
    class: MLflowExpManager
    module_path: qlib.workflow.expm
    kwargs:
      uri: file://./temp/mlruns
      default_exp_name: pointwise_transformer_test

task:
  model:
    class: PointwiseTransformerModel
    module_path: "code.models.PointwiseStockTransformer.PointwiseStockTransformer"
    kwargs:
      d_feat: 6
      seq_len: 60
      d_model: 256
      nhead: 4
      num_layers: 3
      dim_feedforward: 512
      dropout: 0.1
      batch_size: 64
      n_epochs: 50
      lr: 1.0e-4
      weight_decay: 1.0e-5
      loss: "mse"
      seed: 42

  dataset:
    class: TSDatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: StockDataHandler
        module_path: "code.handlers.stock_handler"
        kwargs:
          instruments: "all"
          start_time: "2024-01-01"
          end_time: "2026-04-17"
          fit_start_time: "2024-01-01"
          fit_end_time: "2026-02-10"
          infer_processors:
            - class: MomentumProcessor
              module_path: "code.processors.custom_processor"
            - class: VolatilityProcessor
              module_path: "code.processors.custom_processor"
            - class: VolumeProcessor
              module_path: "code.processors.custom_processor"
            - class: MomentumQualityProcessor
              module_path: "code.processors.custom_processor"
            - class: TailRiskProcessor
              module_path: "code.processors.custom_processor"
            - class: DistributionProcessor
              module_path: "code.processors.custom_processor"
            - class: LiquidityProcessor
              module_path: "code.processors.custom_processor"
            - class: PricePositionProcessor
              module_path: "code.processors.custom_processor"
            - class: VolatilityStructureProcessor
              module_path: "code.processors.custom_processor"
            - class: CrossSectionalRankProcessor
              module_path: "code.processors.custom_processor"
            - class: MarketLevelProcessor
              module_path: "code.processors.custom_processor"
            - class: SectorLevelProcessor
              module_path: "code.processors.custom_processor"
            - class: RobustZScoreNorm
              kwargs:
                fields_group: "feature"
                clip_outlier: True
            - class: Fillna
              kwargs:
                fields_group: "feature"
          learn_processors:
            - class: DropnaLabel
      segments:
        train: ["2024-01-01", "2026-02-10"]
        valid: ["2026-02-11", "2026-04-10"]
        test:  ["2026-04-13", "2026-04-17"]
      step_len: 60
      fillna_type: "ffill+bfill"

  record:
    - class: SignalRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        model: <MODEL>
        dataset: <DATASET>
    - class: SigAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        ana_long_short: False
        ann_scaler: 252